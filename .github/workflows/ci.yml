name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security-layout:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic>=2.7,<3" \
            "pydantic-settings>=2.5,<3" \
            "shapely>=2,<3" \
            "pytest>=8,<9" \
            "ruff>=0.6,<1"
      - name: Lint developed modules
        run: |
          ruff check \
            furniture_ai/config.py \
            furniture_ai/layout/constraints.py \
            furniture_ai/layout/generator.py \
            tests
      - name: Run focused tests
        run: pytest -q tests
